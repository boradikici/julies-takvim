<title>Julie’s Jazz – Etkinlik Takvimi</title>
<style>
:root{--bg:#f4f2ef;--fg:#161616;--card:#fff;--line:#d9d5cf;--mut:#777;--red:#f70000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--fg:#f2f0ec;--card:#1f1e1c;--line:#363431;--mut:#999;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--fg:#f2f0ec;--card:#1f1e1c;--line:#363431;--mut:#999;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.top{display:flex;align-items:center;gap:14px;padding:16px 18px}
.top img{width:52px;height:52px}
h1{font-size:20px;margin:0;font-weight:700}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 12px;color:var(--mut)}
main{max-width:640px;margin:0 auto;padding:0 14px 40px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.seg{display:flex;gap:8px;margin-bottom:12px}
button,.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:11px 14px;cursor:pointer}
.seg button{flex:1}.seg button.on{background:var(--red);border-color:var(--red);color:#fff}
.pri{background:var(--red);border-color:var(--red);color:#fff;width:100%;font-size:16px;padding:14px}
input[type=date],input[type=month],input[type=text]{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.rng{font-weight:700;margin:8px 0 12px}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0 14px;font-size:14px}
.row{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;display:grid;gap:8px}
.row.dim{opacity:.5}
.r1{display:flex;gap:8px}.r1 .x{padding:8px 12px}
.ph{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.th{width:48px;height:60px;border-radius:6px;background:#555 center/cover;display:block;border:1px solid var(--line)}
#out img{width:100%;border-radius:8px;display:block;margin-bottom:10px}
#out .b{display:flex;gap:8px}#out .b button{flex:1}
.hint{font-size:12px;color:var(--mut);margin-top:8px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;z-index:50}#bar[hidden]{display:none}#bar{flex-wrap:wrap}#bar span{flex:1 1 100%;font-size:13px}#bar button{flex:1;width:auto;padding:12px 10px;font-size:15px}main{padding-bottom:140px}
html{-webkit-text-size-adjust:100%}
main{display:flex;flex-direction:column}#gen{order:2}
input,select,textarea,button{font-size:16px;max-width:100%}
button,.btn{min-height:44px}.btn{display:flex;align-items:center;justify-content:center}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;min-height:44px;min-width:0}
.r1 input{flex:1;min-width:0}.r1 .x{padding:10px 16px}
.fr{flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{aspect-ratio:1;border-radius:10px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg) center/cover;line-height:1.1}
.tile b{font-size:22px}.tile small{font-size:11px;color:var(--mut)}
.tile.has{background-color:#222;color:#fff}.tile.has small{color:#ddd}.tile.has b{text-shadow:0 1px 4px #000}
.tile.on{outline:3px solid var(--red);outline-offset:1px}
#crop{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
#crop .cc{background:var(--card);color:var(--fg);border-radius:14px;padding:16px;max-width:420px;width:100%}
#crop canvas{display:block;margin:0 auto 10px;border-radius:8px;touch-action:none;background:#000}
.lb{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);resize:vertical}
.bgr{display:flex;gap:8px}.bgr>*{flex:1;text-align:center}
.fr{display:flex;gap:8px;align-items:center;margin-top:8px}.fr select,.fr input{font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0}.fr label{display:flex;align-items:center;gap:6px;font-size:13px}.fr input{width:80px}
.cols{display:flex;flex-wrap:wrap;gap:10px}.cols label{display:flex;align-items:center;gap:6px;font-size:13px}
input[type=color]{width:38px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
</style>
